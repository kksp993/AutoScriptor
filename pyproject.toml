[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscriptor"
version = "1.0.3"
description = "Android 模拟器游戏自动化的通用层：设备控制、OCR/识别、通用配置与路径。"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "See LICENSE" }

# 只列 AutoScriptor 自己 import 的第三方包；WebUI/游戏层/测试的依赖
# （fastapi、uvicorn、cryptography、dpath、openpyxl…）不在这里，见 extras。
dependencies = [
    "adbutils==1.2.15",
    "numpy>=1.24.4,<2.0.0",
    "opencv-python",
    "pillow>=10.0.0",
    "rich>=13.0.0",
    "fuzzywuzzy",
    # fuzzywuzzy.StringMatcher 直接 `from Levenshtein import *`；缺失会退回纯
    # Python 匹配并显著拖慢 OCR 文本比对，属性能必需件。
    "python-Levenshtein",
    "lxml",
    "pyyaml",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.1",
    "paddleocr==3.7.0",
    # 保留 pkg_resources：adbutils 1.2.15 仍经 pkg_resources 导入链。
    "setuptools<81",
]

[project.optional-dependencies]
# OCR 运行时二选一，与 data/config.json -> ocr.use_gpu 保持一致。
cpu = ["paddlepaddle==3.2.0", "mkl>=2023.0.0"]
gpu = ["paddlepaddle-gpu==3.2.2"]
# WebUI 后端（backend/webui）与编辑器依赖，不属于框架本身。
web = [
    "fastapi",
    "python-multipart>=0.0.9",
    "uvicorn[standard]",
    "websockets",
    "dpath",
    "requests",
    "onepush>=1.3.0",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["AutoScriptor*"]
