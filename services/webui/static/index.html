<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>造笔 - AutoScriptor</title>
  <script src="/vendor/tailwind.css"></script>
  <link href="/vendor/font-awesome.min.css" rel="stylesheet" />
  <script src="/vendor/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/vendor/element-plus.css" />
  <script src="/vendor/element-plus.full.js"></script>
  <script src="/vendor/ansi_up.min.js"></script>
  <script>
    (function(){
      if (typeof window.AnsiUp === 'undefined') {
        class SimpleAnsiUp { ansi_to_html(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } }
        window.AnsiUp = SimpleAnsiUp;
      }
    })();
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary:'#22c55e', secondary:'#64748b', dark:'#1e293b', light:'#f8fafc' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto { content-visibility: auto; }
      .task-tree-item { @apply py-2.5 px-3.5 hover:bg-primary/10 transition-colors cursor-pointer; }
      .log-container { @apply bg-dark/5 rounded-lg p-5 overflow-auto text-sm; }
      .log-line { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; white-space: pre-wrap; }
      .stat-card { @apply bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center transition-all duration-300 hover:shadow-lg; }
      .stat-value { @apply text-3xl font-bold; }
      .stat-label { @apply text-base text-gray-500 mt-1.5; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/style.css?v=27" />
</head>
<body class="app-body overflow-hidden" style="height:100vh;">
  <div id="app" class="flex h-screen overflow-hidden">

    <!-- 侧边栏 -->
    <app-sidebar
      :active-tab="activeTab"
      :theme="currentTheme"
      :scheduler-status="schedulerStatus"
      :character-name="characterName"
      @navigate="activeTab=$event">
    </app-sidebar>

    <!-- 右侧主区域 -->
    <div class="main-shell flex flex-col flex-1 min-w-0 overflow-hidden">

      <!-- 顶栏 -->
      <header class="topbar flex-shrink-0">
        <span class="topbar-title">{{ pageTitle }}</span>
        <div class="flex items-center gap-3">

          <!-- 最小化到托盘（仅 Electron 模式显示） -->
          <button v-if="isElectron"
                  class="topbar-icon-btn inline-flex items-center justify-center w-7 h-7 rounded transition-colors"
                  title="最小化到系统托盘"
                  @click="minimizeToTray">
            <i class="fa fa-arrow-down text-sm"></i>
          </button>

          <!-- 账号切换下拉 -->
          <el-dropdown trigger="click" @command="switchAccount">
            <span class="profile-dropdown topbar-profile text-sm font-medium">
              <i class="fa fa-id-card-o"></i>
              {{ currentAccount || '无账号' }}
              <i class="fa fa-caret-down" style="margin-left:3px"></i>
            </span>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item v-for="a in accounts" :key="a" :command="a"
                  :class="{ 'font-bold': a === currentAccount }">
                  <i class="fa fa-check" v-if="a === currentAccount" style="margin-right:6px;color:#22c55e"></i>
                  {{ a }}
                  <el-button v-if="a !== currentAccount" type="danger" link size="small"
                    style="margin-left:12px" @click.stop="deleteAccount(a)">
                    <i class="fa fa-trash-o"></i>
                  </el-button>
                </el-dropdown-item>
                <el-dropdown-item divided :command="'__new__'" @click="accountDialogVisible=true">
                  <i class="fa fa-plus" style="margin-right:6px"></i>新建账号
                </el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>

          <!-- 角色切换下拉 -->
          <el-dropdown v-if="currentAccount && charactersList.length" trigger="click">
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-green-50 text-green-700 rounded-full text-sm font-medium cursor-pointer">
              <i class="fa fa-user text-sm"></i>
              {{ characterDisplayName || '选择角色' }}
              <i class="fa fa-caret-down" style="margin-left:3px"></i>
            </span>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item v-for="c in charactersList" :key="c.server+'/'+c.name"
                  @click="switchCharacter(c.server, c.name)"
                  :class="{ 'font-bold': c.server === activeCharacter.server && c.name === activeCharacter.name }">
                  <i class="fa fa-check" v-if="c.server === activeCharacter.server && c.name === activeCharacter.name"
                    style="margin-right:6px;color:#22c55e"></i>
                  {{ c.label }}
                  <el-button v-if="!(c.server === activeCharacter.server && c.name === activeCharacter.name)"
                    type="danger" link size="small" style="margin-left:12px"
                    @click.stop="deleteCharacter(c.server, c.name)">
                    <i class="fa fa-trash-o"></i>
                  </el-button>
                </el-dropdown-item>
                <el-dropdown-item divided @click="characterDialogVisible=true">
                  <i class="fa fa-plus" style="margin-right:6px"></i>添加角色
                </el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>

          <span v-else-if="characterName"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-green-50 text-green-700 rounded-full text-sm font-medium">
            <i class="fa fa-user text-sm"></i>{{ characterName }}
          </span>
          <button v-if="!characterName && !activeCharacter.name"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 text-amber-700 rounded-full text-sm font-medium hover:bg-amber-100 transition-colors"
                  @click="verifyAccount">
            <i class="fa fa-key text-sm"></i>验证账号
          </button>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium"
                :style="{ background: schedulerStatus.color==='green'?'#dcfce7':schedulerStatus.color==='orange'?'#fef3c7':'#fecaca',
                          color:      schedulerStatus.color==='green'?'#166534':schedulerStatus.color==='orange'?'#92400e':'#991b1b' }">
            <span class="w-1.5 h-1.5 rounded-full inline-block"
                  :style="{ background: schedulerStatus.color==='green'?'#22c55e':schedulerStatus.color==='orange'?'#f59e0b':'#ef4444' }"></span>
            {{ schedulerStatus.label || '未知' }}
          </span>
        </div>
      </header>

      <!-- 内容区 -->
      <main class="flex-1 overflow-hidden p-5 flex flex-col min-h-0">

        <news-panel v-if="activeTab==='news'"></news-panel>

        <overview-panel v-if="activeTab==='overview'"
          :overview-data="overviewData" :character-name="characterName"
          :accounts="accounts" :current-account="currentAccount"
          :characters-tree="charactersTree" :active-character="activeCharacter"
          :dispatch-queue="dispatchQueue" :all-tasks-summary="allTasksSummary"
          :is-dispatch-running="isDispatchRunning" :dispatch-progress="dispatchProgress"
          :logs="logs" :overview-security-unlocked="overviewSecurityUnlocked"
          @verify-account="verifyAccount" @switch-character="switchCharacter"
          @add-to-dispatch="addToDispatch" @remove-from-dispatch="removeFromDispatch"
          @reorder-dispatch="reorderDispatchQueue"
          @run-all-dispatch="runAllDispatchTasks" @stop-dispatch="stopDispatch"
          @switch-account="switchAccount" @refresh-overview="refreshOverviewPanel"
          @lock-overview-security="clearOverviewSecurityUnlocked"></overview-panel>

        <scheduler-panel v-if="activeTab==='scheduler'"
          :overview-data="overviewData" :logs="logs" :character-name="characterName"
          :scheduler-status="schedulerStatus"
          @start-run="startRun" @stop-run="stopRun" @verify-account="verifyAccount"
          @open-add-account="openAddAccountDialog" @reset-scheduler="resetScheduler"
          @clear-logs="clearLogs"></scheduler-panel>

        <editor-panel v-if="activeTab==='editor'"></editor-panel>

        <update-panel v-if="activeTab==='updater'"></update-panel>

        <settings-panel v-if="activeTab==='settings'"
          :filtered-config="filteredConfig"
          @save-settings="saveSettings"></settings-panel>

        <task-panel v-if="activeTab==='daily' || activeTab==='weekly' || activeTab==='general' || activeTab==='event'"
          :current-tasks="currentTasks" :logs="logs" :character-name="characterName"
          :scheduler-status="schedulerStatus"
          @edit-task="openEditModal" @expanded-change="setActiveGroup"
          @start-run="startRun" @stop-run="stopRun" @verify-account="verifyAccount"
          @open-add-account="openAddAccountDialog" @save-tasks="saveTasks"
          @clear-logs="clearLogs" @refresh-config="refreshConfig" @reset-scheduler="resetScheduler"
          @run-task="runSingleTask"></task-panel>

      </main>
    </div>

    <!-- 编辑任务对话框 -->
    <teleport to="body">
      <el-dialog v-model="editModalVisible" :title="'编辑任务: '+editTaskPath" width="600px" destroy-on-close>
        <el-form :model="editTaskData" label-width="100px">
          <el-form-item label="启用状态"><el-switch v-model="editTaskData.on"></el-switch></el-form-item>
          <template v-for="(val, key) in editTaskData.params" :key="key">
            <el-form-item :label="paramLabel(key)" v-if="paramEnumOptions[key] && !enumParamIsMultiple(key)">
              <el-select v-model="editTaskData.params[key]" placeholder="请选择">
                <el-option v-for="o in paramEnumOptions[key]" :key="o.value || o" :label="o.label || o" :value="o.value || o"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item :label="paramLabel(key)" v-else-if="paramEnumOptions[key] && enumParamIsMultiple(key)">
              <el-select v-model="editTaskData.params[key]" multiple placeholder="请选择">
                <el-option v-for="o in paramEnumOptions[key]" :key="o.value || o" :label="o.label || o" :value="o.value || o"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item :label="paramLabel(key)" v-else-if="typeof val==='boolean'"><el-switch v-model="editTaskData.params[key]"></el-switch></el-form-item>
            <el-form-item :label="paramLabel(key)" v-else-if="typeof val==='number'"><el-input-number v-model="editTaskData.params[key]" :min="0"></el-input-number></el-form-item>
            <el-form-item :label="paramLabel(key)" v-else-if="typeof val==='string'"><el-input v-model="editTaskData.params[key]"></el-input></el-form-item>
            <el-form-item :label="paramLabel(key)" v-else-if="Array.isArray(val)">
              <div class="w-full space-y-2">
                <div v-for="(item, idx) in editTaskData.params[key]" :key="idx" class="flex items-center gap-2">
                  <el-input-number v-if="typeof item==='number'" v-model="editTaskData.params[key][idx]"></el-input-number>
                  <el-switch v-else-if="typeof item==='boolean'" v-model="editTaskData.params[key][idx]"></el-switch>
                  <el-input v-else v-model="editTaskData.params[key][idx]"></el-input>
                  <el-button type="danger" size="small" @click="removeListItem(key, idx)">删除</el-button>
                </div>
                <el-button size="small" @click="addListItem(key)">新增一项</el-button>
              </div>
            </el-form-item>
          </template>
        </el-form>
        <template #footer>
          <el-button @click="editModalVisible=false">取 消</el-button>
          <el-button type="primary" @click="saveTask">保 存</el-button>
        </template>
      </el-dialog>
    </teleport>

    <!-- 修改账密对话框 -->
    <teleport to="body">
      <el-dialog v-model="addDialogVisible" title="修改账号密码" width="500px">
        <el-form :model="addForm" label-width="90px">
          <el-form-item label="游戏账号"><el-input v-model="addForm.account" placeholder="请输入账号"></el-input></el-form-item>
          <el-form-item label="游戏密码"><el-input v-model="addForm.password" type="password" placeholder="请输入密码"></el-input></el-form-item>
          <el-form-item label="安全密码"><el-input v-model="addForm.security_key" type="password" placeholder="用于加密保存"></el-input></el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="addDialogVisible=false">取 消</el-button>
          <el-button type="primary" @click="submitAddAccount">确 定</el-button>
        </template>
      </el-dialog>
    </teleport>

    <!-- 新建账号对话框 -->
    <teleport to="body">
      <el-dialog v-model="accountDialogVisible" title="新建账号" width="500px">
        <el-alert type="info" :closable="false" style="margin-bottom:16px"
          description="每个账号存储独立的游戏凭据和角色数据。创建后可在账号下添加多个服务器和角色，每个角色拥有独立的任务列表。"></el-alert>
        <el-form :model="newAccountForm" label-width="100px">
          <el-form-item label="账号名称" required>
            <el-input v-model="newAccountForm.name" placeholder="如: 大号、小号"></el-input>
          </el-form-item>
          <el-form-item label="游戏账号">
            <el-input v-model="newAccountForm.account" placeholder="游戏登录账号"></el-input>
          </el-form-item>
          <el-form-item label="游戏密码">
            <el-input v-model="newAccountForm.password" type="password" placeholder="游戏登录密码" show-password></el-input>
          </el-form-item>
          <el-form-item label="服务器">
            <el-input v-model="newAccountForm.server" placeholder="如: 1区、测试服"></el-input>
          </el-form-item>
          <el-form-item label="角色名">
            <el-input v-model="newAccountForm.character_name" placeholder="角色名/ID"></el-input>
          </el-form-item>
          <el-form-item label="安全密码" required>
            <el-input v-model="newAccountForm.security_key" type="password" placeholder="用于加密账号凭据" show-password></el-input>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="accountDialogVisible=false">取 消</el-button>
          <el-button type="primary" @click="addAccount">创 建</el-button>
        </template>
      </el-dialog>
    </teleport>

    <!-- 添加角色对话框 -->
    <teleport to="body">
      <el-dialog v-model="characterDialogVisible" title="添加角色" width="450px">
        <el-alert type="info" :closable="false" style="margin-bottom:16px"
          description="在当前账号下添加新角色。每个角色按「服务器 + 角色名」唯一标识，拥有独立的任务列表。"></el-alert>
        <el-form :model="newCharacterForm" label-width="90px">
          <el-form-item label="服务器" required>
            <el-input v-model="newCharacterForm.server" placeholder="如: 1区、测试服"></el-input>
          </el-form-item>
          <el-form-item label="角色名" required>
            <el-input v-model="newCharacterForm.character" placeholder="角色名/ID"></el-input>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="characterDialogVisible=false">取 消</el-button>
          <el-button type="primary" @click="addCharacter">添 加</el-button>
        </template>
      </el-dialog>
    </teleport>

    <!-- 密码登录对话框 -->
    <teleport to="body">
      <el-dialog v-model="authRequired" title="WebUI 密码保护" width="380px"
                 :close-on-click-modal="false" :close-on-press-escape="false" :show-close="false">
        <div style="text-align:center;margin-bottom:16px">
          <i class="fa fa-lock" style="font-size:36px;color:#22c55e"></i>
          <p style="margin-top:8px;color:#64748b;font-size:14px">请输入访问密码</p>
        </div>
        <el-input v-model="loginPassword" type="password" placeholder="输入密码"
                  show-password size="large"
                  @keyup.enter="submitLogin"
                  style="margin-bottom:16px"></el-input>
        <div style="text-align:center">
          <el-button type="primary" size="large" style="width:100%" @click="submitLogin">登 录</el-button>
        </div>
      </el-dialog>
    </teleport>

  </div>

  <!-- Vue 组件 -->
  <script src="/static/js/components/NewsPanel.js?v=3"></script>
  <script src="/static/js/components/AppSidebar.js?v=11"></script>
  <script src="/static/js/task_help_docs.js?v=1"></script>
  <script src="/static/js/components/TaskTree.js?v=10"></script>
  <script src="/static/js/components/Overview.js?v=12"></script>
  <script src="/static/js/components/SchedulerPanel.js?v=9"></script>
  <script src="/static/js/components/TaskPanel.js?v=9"></script>
  <script src="/static/js/components/Settings.js?v=8"></script>
  <script src="/static/js/components/UpdatePanel.js?v=1"></script>
  <script src="/static/js/components/editor/EditorCanvas.js?v=10"></script>
  <script src="/static/js/components/editor/EditorControls.js?v=14"></script>
  <script src="/static/js/components/editor/EditorPanel.js?v=24"></script>
  <script src="/static/js/app.js?v=13"></script>
</body>
</html>
