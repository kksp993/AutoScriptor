# 琉离战斗循环（覆盖 default）
战斗循环:
  策略:
    战斗:
      有cd:
        1倍速: 战斗_有cd_1x
        3倍速: 战斗_有cd_3x
      无cd: 战斗_无cd
    赶路:
      有cd: 赶路_有cd
      无cd: 赶路_无cd

  初始:
    - 化身

  轮替:
    - 战斗:1
    - 赶路:1

  触发器:
    - 时刻: 30
      执行: 真武
    - 时刻: 40
      执行: 化身长按:1
    - 每: 60
      执行: 化身

  超时: 300
