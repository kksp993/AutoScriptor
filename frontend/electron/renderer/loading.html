<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>造笔 - AutoScriptor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes loading-breathe {
      0%, 100% { background-position: 0% 20%; }
      50% { background-position: 0% 80%; }
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 28px rgba(22,163,74,0.22), 0 2px 8px rgba(0,0,0,0.08); }
      50% { box-shadow: 0 8px 40px rgba(22,163,74,0.38), 0 2px 12px rgba(0,0,0,0.10); }
    }

    body {
      position: relative;
      min-height: 100vh;
      color: #1e293b;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .loading-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(160deg, #d4f0d9 0%, #f0fdf4 42%, #e0f2fe 100%);
      background-size: 100% 220%;
      animation: loading-breathe 8s ease-in-out infinite;
    }

    .particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .particle-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.32) 100%);
    }

    .loading-main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      padding: 0 16px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo-icon svg {
      width: 38px;
      height: 38px;
    }
    .logo-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .logo-cn {
      font-size: 36px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 8px;
      line-height: 1.2;
    }
    .logo-en {
      font-size: 13px;
      color: #64748b;
      letter-spacing: 2px;
      font-weight: 400;
    }

    .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(22, 163, 74, 0.2);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 14px;
      color: #64748b;
      letter-spacing: 0.3px;
    }

    .progress-bar {
      width: 280px;
      height: 3px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
      animation: progress-pulse 2s ease-in-out infinite;
    }
    @keyframes progress-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.6; }
    }

    .log-box {
      width: 560px;
      max-width: 90vw;
      height: 140px;
      /* 比全屏呼吸渐变更淡的薄荷绿底，避免「一片白」 */
      background: linear-gradient(
        165deg,
        rgba(220, 252, 231, 0.38) 0%,
        rgba(209, 250, 229, 0.32) 45%,
        rgba(200, 245, 220, 0.28) 100%
      );
      border: 1px solid rgba(22, 163, 74, 0.09);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: #475569;
      box-shadow: 0 1px 8px rgba(22, 163, 74, 0.06);
    }
    .log-box::-webkit-scrollbar { width: 4px; }
    .log-box::-webkit-scrollbar-thumb {
      background: rgba(22, 163, 74, 0.14);
      border-radius: 2px;
    }
    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.highlight { color: #15803d; font-weight: 500; }
    .log-line.error     { color: #dc2626; }

    .ready-badge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #166534;
    }
    .ready-badge.show { display: flex; }
    .ready-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    .version {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: #64748b;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-gradient { animation: none; }
      .logo-icon { animation: none; }
      .progress-fill { animation: none; }
    }

    /* 窗口控制按钮（右上角） */
    .win-controls {
      position: fixed;
      top: 8px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 2px;
      z-index: 9999;
    }
    .win-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }
    .win-btn:hover {
      background: rgba(22, 163, 74, 0.1);
      color: #15803d;
    }
    .win-btn.close:hover {
      background: rgba(239, 68, 68, 0.12);
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="loading-gradient" aria-hidden="true"></div>
  <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
  <div class="particle-overlay" aria-hidden="true"></div>

  <div class="loading-main">
    <!-- 窗口控制按钮（仅 Electron 模式可用） -->
    <div class="win-controls" id="winControls" style="display:none">
      <button class="win-btn" id="btnTray" title="最小化到系统托盘">↓</button>
      <button class="win-btn close" id="btnClose" title="退出应用">✕</button>
    </div>

    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M27 5L31.5 9.5L16 27.5L11.5 23Z" fill="white" opacity="0.95"/>
          <path d="M16 27.5L11.5 23L8.5 33.5Z" fill="white" opacity="0.8"/>
          <circle cx="8" cy="35" r="2" fill="white" opacity="0.9"/>
          <line x1="8" y1="31" x2="8" y2="29.5" stroke="white" opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="4" y1="35" x2="2.5" y2="35" stroke="white" opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="5.2" y1="32.2" x2="4" y2="31" stroke="white" opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="5.2" y1="37.8" x2="4" y2="39" stroke="white" opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-brand">
        <div class="logo-cn">造笔</div>
        <div class="logo-en">AutoScriptor</div>
      </div>
    </div>

    <div class="status-area">
      <div class="spinner" id="spinner"></div>
      <div class="status-text" id="statusText">正在启动 Python 服务...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="ready-badge" id="readyBadge">
        <span class="ready-dot"></span>服务就绪，正在加载界面…
      </div>
    </div>

    <div class="log-box" id="logBox"></div>

    <div class="version">造笔 AutoScriptor v1.0</div>
  </div>

  <script>
    (function(){
      const cvs = document.getElementById('particleCanvas');
      if (!cvs || !cvs.getContext) return;
      const ctx = cvs.getContext('2d');
      const particles = [];
      const PARTICLE_COUNT = 60;
      const CONNECT_DIST = 105;

      function resizeCanvas() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        cvs.width = w * dpr;
        cvs.height = h * dpr;
        cvs.style.width = w + 'px';
        cvs.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function createParticle(w, h) {
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 2 + 0.5,
          a: Math.random() * 0.35 + 0.12,
        };
      }

      function initParticles() {
        const w = cvs.width / (window.devicePixelRatio || 1);
        const h = cvs.height / (window.devicePixelRatio || 1);
        particles.length = 0;
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle(w, h));
      }

      function animateParticles() {
        const dpr = window.devicePixelRatio || 1;
        const w = cvs.width / dpr;
        const h = cvs.height / dpr;
        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < particles.length; i++) {
          const a = particles[i];
          for (let j = i + 1; j < particles.length; j++) {
            const b = particles[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < CONNECT_DIST) {
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = 'rgba(22,163,74,' + (0.12 * (1 - d / CONNECT_DIST)) + ')';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(22,163,74,' + p.a + ')';
          ctx.fill();
        }
        requestAnimationFrame(animateParticles);
      }

      resizeCanvas();
      initParticles();
      animateParticles();
      window.addEventListener('resize', function() {
        resizeCanvas();
        initParticles();
      });
    })();

    const statusText  = document.getElementById('statusText');
    const spinner     = document.getElementById('spinner');
    const progressFill = document.getElementById('progressFill');
    const readyBadge  = document.getElementById('readyBadge');
    const logBox      = document.getElementById('logBox');

    let logCount = 0;
    let progress = 5;

    function addLog(msg, type = '') {
      if (!msg || !msg.trim()) return;
      logCount++;
      const line = document.createElement('div');
      line.className = 'log-line' + (type ? ' ' + type : '');
      line.textContent = msg;
      logBox.appendChild(line);
      if (logBox.children.length > 120) logBox.removeChild(logBox.firstChild);
      logBox.scrollTop = logBox.scrollHeight;

      progress = Math.min(progress + 1.2, 90);
      progressFill.style.width = progress + '%';
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    if (window.electron) {
      document.getElementById('winControls').style.display = 'flex';
      document.getElementById('btnTray').onclick  = () => window.electron.windowTray();
      document.getElementById('btnClose').onclick = () => window.electron.windowClose();

      window.electron.onLog(msg => {
        const isHighlight = /startup complete|running on|就绪|ready/i.test(msg);
        const isError     = /error|exception|traceback/i.test(msg);
        addLog(msg, isHighlight ? 'highlight' : isError ? 'error' : '');

        if (/startup complete|running on/i.test(msg)) {
          setStatus('服务已启动，正在连接...');
        }
      });

      window.electron.onStatus(status => {
        const statusTextMap = {
          'electron-ready': '正在准备桌面环境...',
          'checking-install': '正在检查运行目录...',
          'creating-window': '正在创建启动窗口...',
          'window-visible': '启动窗口已显示，正在准备后端...',
          'checking-port': '正在检查本地端口...',
          'starting-backend': '正在准备后端服务...',
          'starting-python': '正在启动 Python 环境...',
          'backend-spawned': 'Python 进程已启动，正在导入依赖...',
          'waiting-webui': '正在连接本地 WebUI...',
          'webui-ready': '后端服务已启动，正在加载界面...',
          'starting': '正在启动 Python 服务...',
        };
        if (status === 'ready') {
          setStatus('服务就绪，正在跳转...');
          progressFill.style.width = '100%';
          spinner.style.display = 'none';
          readyBadge.classList.add('show');
          addLog('✅ 服务就绪，正在加载造笔...', 'highlight');
        } else {
          setStatus(statusTextMap[status] || '正在启动...');
          if (status === 'backend-spawned') {
            progressFill.style.width = '35%';
          } else if (status === 'waiting-webui') {
            progressFill.style.width = '65%';
          } else if (status === 'webui-ready') {
            progressFill.style.width = '85%';
          } else if (status === 'starting-python' || status === 'starting-backend') {
            progressFill.style.width = '25%';
          } else if (status === 'window-visible') {
            progressFill.style.width = '18%';
          }
        }
      });
    } else {
      setStatus('加载中... (开发模式)');
      addLog('[dev] preload not available', 'error');
    }

    setInterval(() => {
      if (progress < 85) {
        progress += 0.3;
        progressFill.style.width = progress + '%';
      }
    }, 600);
  </script>
</body>
</html>
